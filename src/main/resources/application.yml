spring:
  application:
    name: banco-digital
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/banco_digital?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:banco}
    password: ${SPRING_DATASOURCE_PASSWORD:banco123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: VARCHAR
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.banco.digital: INFO
